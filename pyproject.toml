[project]
name = "searchthearxiv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.36,<3",
    "pinecone>=6,<7",
]

[project.optional-dependencies]
app = [
    "Flask>=3.1,<4",
    "requests-html==0.10.0",
    "lxml>=6.1,<7",
    "lxml_html_clean",
    "validators>=0.35,<1",
    "gunicorn>=26,<27",
]
data = [
    "tiktoken>=0.12,<1",
    "tqdm>=4.67,<5",
    "kaggle>=2.1,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "data"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
